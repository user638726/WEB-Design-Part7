        .help-section {
            background: #F8F9FA;
            /* 灰底滿版 */
        }

        .help-card {
            width: 260px;
            height: 84px;
            background: #FFFFFF;
            border-radius: 4px;
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.15);
            transition: transform .15s ease;
            /* transition 放在本體比較順 */
        }

        /* 讓 card-body 完整吃滿 84px，內容精準置中 */
        .help-card-body {
            height: 84px;
            padding: 0;
            /* 移除 card-body 預設 padding */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .help-icon {
            font-size: 24px;
            /* 依你設計稿 24px 的感覺 */
            color: #0dcaf0;
            /* 你原本用 text-info 也可以，這裡直接寫死更穩 */
        }

        .help-card:hover {

<body>
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">
            <a class="navbar-brand text1" href="#">
                <i class="bi bi-record-fill text-info"></i>小懶蟲
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-lg-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item mx-3">
                        <a class="nav-link  noto-sans-regular" aria-current="page" href="#">首頁</a>
                    </li>
                    <li class="nav-item mx-3">
                        <a class="nav-link noto-sans-regular" href="#">服務介紹</a>
                    </li>
                    <li class="nav-item mx-3">
                        <a class="nav-link noto-sans-regular" href="#">方案費用</a>
                    </li>
                    <li class="nav-item mx-3">
                        <a class="nav-link text-info noto-sans-regular" href="#">常見問題</a>
                    </li>
                    <li class="nav-item mx-3">
                        <a class="btn btn-info text2" href="#">方案費用</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="py-6" style="background-image: url(./img/bg_paper.png); height:180px;">
        <div class="text-center">
            <p class="text3">HAPPY LIFE</p>
            <h1 class="text4">開始當個小懶蟲</h1>
        </div>
    </section>

    <section class="py-6 container">
        <div class="row justify-content-center">
            <div class="col-lg-8 p-0">
                <form action="" class="p-lg-5 p-3 shadow-lg">
                    <h3 class="deco-line mb-3 text7">選擇方案</h3>
                    <div class="row row-cols-1 row-cols-lg-3 g-2 g-lg-3">
                        <div class="col">
                            <button type="button" class="btn btn-outline-info w-100 btn-lg py-3 text4">
                                小小搭懶蟲<br class="d-none d-lg-block">
                                NT 298/月
                            </button>
                        </div>
                        <div class="col">
                            <button type="button" class="btn btn-outline-info w-100 btn-lg py-3 text4">
                                睡一整天囉<br class="d-none d-lg-block">
                                NT 666/月
                            </button>
                        </div>
                        <div class="col">
                            <button type="button" class="btn btn-info w-100 btn-lg py-3 btn-special active text6 text-white">
                                客製化方案<br class="d-none d-lg-block">
                                客服詢價
                            </button>
                        </div>
                    </div>
                    <h3 class="deco-line mt-4 mt-lg-5 mb-3 text7">填寫資料</h3>

                    <div class="row g-3">
                        <!-- 名字 / 姓氏：手機單欄，md 以上雙欄 -->
                        <div class="col-12 col-md-6">
                            <label for="firstName" class="form-label text8 mb-1">名字</label>
                            <input type="text" id="firstName" class="form-control" />
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="lastName" class="form-label text8 mb-1">姓氏</label>
                            <input type="text" id="lastName" class="form-control" />
                        </div>

                        <!-- 下面全部單欄 -->
                        <div class="col-12">
                            <label for="phone" class="form-label text8 mb-1">手機號碼</label>
                            <input type="tel" id="phone" class="form-control" />
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label text8 mb-1">電子郵件</label>
                            <input type="email" id="email" class="form-control" />
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label text8 mb-1">住址</label>
                            <input type="text" id="address" class="form-control" />
                        </div>

                        <div class="col-12">
                            <label for="time" class="form-label text8 mb-1">方便聯繫時間</label>
                            <select id="time" class="form-select">
                                <option>13:00-17:00</option>
                                <option>09:00-12:00</option>
                                <option>18:00-21:00</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label text8 mb-1">加購服務</label>
                            <div class="row g-3">
                                <div class="col-6 col-md-auto">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="add1">
                                        <label class="form-check-label text8" for="add1">每週一清掃家裡+100</label>
                                    </div>
                                </div>

                                <div class="col-6 col-md-auto">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="add2">
                                        <label class="form-check-label text8" for="add2">按摩+50</label>
                                    </div>
                                </div>

                                <!-- 手機：col-12 會獨佔一行；桌面：col-md-auto 會回到同一行 -->
                                <div class="col-12 col-md-auto">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="add3">
                                        <label class="form-check-label text8" for="add3">聽你說話+150</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="note" class="form-label text8 mb-1">備註說明</label>
                            <textarea id="note" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-info w-100 text9 py-2" type="submit">選擇方案</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section class="py66 help-section">
        <div class="container">
            <h2 class="text-center mb-4 text5">需要其他協助嗎？</h2>

            <div class="row justify-content-center g-4">
                <div class="col-auto">
                    <a href="#" class="help-card card border-0 text-decoration-none">
                        <div class="card-body help-card-body">
                            <i class="bi bi-telephone-fill help-icon"></i>
                            <span class="text12">07-555-666</span>
                        </div>
                    </a>
                </div>

                <div class="col-auto">
                    <a href="#" class="help-card card border-0 text-decoration-none">
                        <div class="card-body help-card-body">
                            <i class="fa-brands fa-facebook-f help-icon"></i>
                            <span class="text12">我就是個小懶蟲</span>
                        </div>
                    </a>
                </div>

                <div class="col-auto">
                    <a href="#" class="help-card card border-0 text-decoration-none">
                        <div class="card-body help-card-body">
                            <i class="bi bi-question-lg help-icon"></i>
                            <span class="text12">常見問題</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <footer class="py-3" style="background: #6C757D;">
        <p class="text-center text-white mb-0 text13">Copyright © 2021 小懶蟲.All rights reserved.</p>
    </footer>

</body>
